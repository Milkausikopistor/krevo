[package]
name = "krevo-wasm"
version = "0.1.0"
edition = "2021"
description = "Krevo wallet cryptography core (constant-time) compiled to WebAssembly for the JavaScript wallets"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
blake2 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
ml-dsa = "0.1"
getrandom = "0.3"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[profile.dev]
# otimizado (ver a nota em ../krevod/Cargo.toml sobre o perfil release nesta máquina)
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug-assertions = false
overflow-checks = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
