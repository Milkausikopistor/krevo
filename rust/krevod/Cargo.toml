[package]
name = "krevod"
version = "0.1.0"
edition = "2021"
description = "Krevo full node in Rust — consensus-compatible reimplementation of the JavaScript reference node"
license = "MIT"

[dependencies]
blake2 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
ml-dsa = "0.1"
getrandom = "0.3"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
# optimized: on some Windows machines Smart App Control blocks the release profile's build
# helpers while the dev profile's ones run. Elsewhere, just use --release.
opt-level = 3

[profile.test]
opt-level = 2
