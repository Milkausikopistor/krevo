# Continuous integration: runs on every change and every pull request (free for public
# GitHub repositories). Contributors see right away whether something broke.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests with the WebAssembly core
        run: node --test "test/*.test.js"
      - name: Tests without WebAssembly (JavaScript plan B)
        run: node --test "test/*.test.js"
        env:
          KREVO_NO_WASM: "1"

  rust:
    name: Rust (krevod node and WebAssembly core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Node tests (JavaScript vectors, fuzzing, vault)
        run: cd rust/krevod && cargo test --release --locked
      - name: Constant-time measurement (native; informational — shared machines are noisy)
        continue-on-error: true
        run: cd rust/krevod && cargo test --release --locked ct_timing -- --ignored --nocapture
      - name: Native prover accepted by the JavaScript verifier
        run: node --test test/fcmp.test.js
        env:
          KREVO_PROVER: rust/krevod/target/release/krevod
      - name: WebAssembly core builds
        run: cd rust/krevo-wasm && cargo build --release --locked --target wasm32-unknown-unknown

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t krevo .
      - name: Run
        run: |
          docker run --rm krevo emission --network testnet | head -5
          docker run --rm --entrypoint krevod krevo help
