# Release: pushing a tag like v0.1.0 builds everything and publishes a GitHub release with
#   • krevo-<tag>.zip / .tar.gz      the complete reference implementation (run it with Node.js 24.7+)
#   • krevod-<tag>-<platform>         the Rust node for Linux, macOS and Windows
#   • SHA256SUMS.txt                  checksums of every file
# and the Docker image ghcr.io/<owner>/krevo:<tag> (and :latest).
# The release notes come from the matching section of CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: node --test "test/*.test.js"
      - run: cd rust/krevod && cargo test --release --locked

  krevod:
    name: krevod (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, exe: krevod }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-gnu, exe: krevod }
          - { os: macos-latest, platform: macos-arm64, target: aarch64-apple-darwin, exe: krevod }
          - { os: macos-latest, platform: macos-x86_64, target: x86_64-apple-darwin, exe: krevod }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc, exe: krevod.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: rust/krevod
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="krevod-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "pkg/$name"
          cp "rust/krevod/target/${{ matrix.target }}/release/${{ matrix.exe }}" LICENSE "pkg/$name/"
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../$name.zip" "$name" > /dev/null; else tar czf "../$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: krevod-${{ matrix.platform }}
          path: krevod-*.*

  source:
    name: Reference implementation package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Package (git archive: exactly the tracked files, including the compiled WebAssembly core)"
        run: |
          git archive --format=zip --prefix="krevo-${GITHUB_REF_NAME}/" -o "krevo-${GITHUB_REF_NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="krevo-${GITHUB_REF_NAME}/" -o "krevo-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: krevo-*.*

  docker:
    name: Docker image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/krevo" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false" # no build-record artifact (it is not a release file)
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest

  release:
    name: Publish the release
    needs: [krevod, source]
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # only the release files: the krevod packages and the source package
      - uses: actions/download-artifact@v4
        with:
          pattern: krevod-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Krevo $GITHUB_REF_NAME" --notes-file notes.md --prerelease --verify-tag
