# Stack of a public testnet operator (an example; adjust it to your server).
#   docker compose up -d                                       # node + light server + explorer + web app
#   MINING_ADDRESS=krvtest1… docker compose --profile mine up -d
#   KREVO_PASSWORD=… docker compose --profile faucet up -d       (after creating and funding the wallet)
# Put HTTPS in front (Caddy, nginx…) of the web app, the light server and the faucet.
# The node's RPC (16211) stays on Docker's internal network only: do not expose it to the Internet.
# Full guide: docs/TESTNET.md

services:
  node:
    build: .
    # Rust node (faster); for the JavaScript reference node, replace it with:
    #   entrypoint: ["node", "src/cli.js"]   (and the same command)
    entrypoint: ["krevod"]
    command: ["node", "--network", "testnet", "--datadir", "/data", "--rpchost", "0.0.0.0"]
    volumes: ["data:/data"]
    ports: ["16210:16210"]
    restart: unless-stopped

  light-server:
    build: .
    command: ["light-server", "--network", "testnet", "--rpc", "http://node:16211", "--public"]
    ports: ["8090:8090"]
    depends_on: [node]
    restart: unless-stopped

  explorer:
    build: .
    command: ["explorer", "--network", "testnet", "--rpc", "http://node:16211", "--public"]
    ports: ["8080:8080"]
    depends_on: [node]
    restart: unless-stopped

  web-wallet:
    build: .
    command: ["web-wallet", "--public"]
    ports: ["8091:8091"]
    restart: unless-stopped

  miner:
    build: .
    profiles: ["mine"]
    command: ["mine", "--network", "testnet", "--rpc", "http://node:16211", "--address", "${MINING_ADDRESS:?set MINING_ADDRESS}"]
    depends_on: [node]
    restart: unless-stopped

  faucet:
    build: .
    profiles: ["faucet"]
    command: ["faucet", "--network", "testnet", "--rpc", "http://node:16211", "--file", "/wallet/faucet-wallet-testnet.json", "--public", "--trusted-proxy"]
    environment: ["KREVO_PASSWORD"]
    volumes: ["faucet:/wallet"]
    ports: ["8092:8092"]
    depends_on: [node]
    restart: unless-stopped

volumes:
  data: {}
  faucet: {}
